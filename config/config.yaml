# ============================================================
# CẤU HÌNH BOT — chỉnh tham số ở đây, không sửa code
# ============================================================

exchange:
  name: binance
  testnet: true          # true = Binance Testnet (tiền ảo). Đổi sang false khi lên thật.

market:
  pairs:                 # giai đoạn học: chỉ Spot, các cặp lớn
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
  timeframe: 1h          # khung nến (1h hoặc 4h cho người mới)
  candles_limit: 200     # số nến lấy mỗi lần (đủ để tính chỉ báo)

# --- Các phần dưới đây để dành cho bước sau, chưa dùng ở bước 1 ---

strategy:
  name: ema_crossover
  ema_fast: 9
  ema_slow: 21

risk:
  risk_per_trade: 0.01       # rủi ro 1% vốn mỗi lệnh
  stop_loss_pct: 0.02        # cắt lỗ cách giá vào 2%
  take_profit_rr: 2.0        # chốt lời ở mức 2 lần khoảng rủi ro (R:R = 2)
  min_rr: 1.5                # tỷ lệ lời/lỗ tối thiểu để được vào lệnh
  fee_rate: 0.001            # phí ~0.1% mỗi chiều
  max_open_per_pair: 1
  max_total_positions: 3
  circuit_breakers:
    daily_loss_limit: 0.05   # lỗ quá 5%/ngày -> dừng hết ngày
    consecutive_losses: 5    # thua 5 lệnh liên tiếp -> tạm dừng
    max_drawdown: 0.20       # sụt 20% so với đỉnh -> ngắt toàn bộ

backtest:
  initial_capital: 10000     # vốn ảo ban đầu (USDT) để chạy backtest
  candles: 1000              # số nến lịch sử lấy về để backtest

storage:
  backend: sqlite            # sqlite (học) hoặc supabase (khi lên thật)
  sqlite_path: data/bot.db
